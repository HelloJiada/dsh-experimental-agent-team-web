# Real-profile integration skeleton for this private web bundle.
# Date: 2026-08-25
#
# 1) Install this bundle into the web profile (tarball or git). The
#    agent-team-web runtime (team kernel, scheduler, event emitter) is built
#    into this bundle — no separate runtime package is needed:
#    cd ~/.dsh/profiles/web
#    pnpm add ./deepseek-ai-dsh-experimental-agent-team-web-0.1.15.tgz
#
# 2) The runtime uses `.agent-team-web/` disk state as truth; it intentionally
#    does not persist external `agent-team-web/*` Session events on DSH 0.1.3.
#    Verify the panel feed through `/plugins/agent-team-web/state`.
#
# 3) Merge this patch into the web profile and validate composition:
#    dsh --profile web --dump-config
#    dsh web
#
# Then ask for a real team directly, for example:
#   /agent-teams review the last 20 commits from performance, security, and product perspectives
#
# Open the captain conversation and verify:
# - the AgentTeams activity badge and panel
# - the Now / Progress / Command summary
# - activity data from /plugins/agent-team-web/state

- insert:
    - id: agent-team-web
      name: "@deepseek-ai/dsh-experimental-agent-team-web"
      inject:
        - sessionProjections
