# Real-profile integration skeleton for this private web bundle.
# Date: 2026-08-25
#
# 1) Install this bundle into the web profile (tarball or git). The
#    agent-team-web runtime (team kernel, scheduler, event emitter) is built
#    into this bundle — no separate runtime package is needed:
#    cd ~/.dsh/profiles/web
#    pnpm add ./deepseek-ai-dsh-experimental-agent-team-web-0.1.0.tgz
#
# 2) Ensure the host recognizes agent-team-web/* session events.
#    The runtime records them best-effort; if `KNOWN_SESSION_EVENT_TYPES`
#    does not include `agent-team-web/*`, this dashboard will stay empty even
#    though `.agent-team-web/` disk state still exists.
#
# 3) Merge this patch into the web profile and validate composition:
#    dsh --profile web --dump-config
#    dsh web
#
# Then ask for a real team directly, for example:
#   /agent-teams review the last 20 commits from performance, security, and product perspectives
#
# Open the conversation, switch to the Team view, and verify:
# - Captain Briefing / Top Interventions
# - timeline summary + milestone windows
# - commandPlan JSON payload in Command Bridge

- insert:
    - id: agent-team-web
      name: "@deepseek-ai/dsh-experimental-agent-team-web"
      inject:
        - sessionProjections
